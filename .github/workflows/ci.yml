name: CI

# CI 只做快速验证和测试；多架构发行产物统一由手动 Build workflow 生成。
#
# 分层原则：按「能不能在没有特权的情况下跑」划分
#
#   verify / test  —— 普通 runner，检查配置、单测和代码格式
#   release        —— 开发者手动运行 build.yml，构建全架构并发布正式 Release
#   e2e            —— 需要 CAP_NET_RAW，只能自托管，靠标签 opt-in
#
# Go 模块缓存由 verify job 保存；test job 只恢复共享缓存。

on:
  push:
    branches: [main, legacy-rust]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # 同一分支的旧运行直接取消：CI 关心的是最新提交。
  # tag 构建不取消：发布流程被打断比多花几分钟更糟。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 快速关卡
  verify:
    name: 构建与版本校验
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod
          cache: false

      - name: 恢复 Go 缓存
        id: gocache
        uses: actions/cache/restore@v4
        with:
          # module 缓存与架构无关，所有 job 共享同一份。
          # 这是编译时间的大头：sing-box 有 40+ 个直接依赖。
          # build 缓存（go-build）也放进来：不同 GOOS/GOARCH 的条目在
          # 同一目录下按平台分子目录，交叉恢复的收益很大。
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gomod-${{ runner.os }}-${{ hashFiles('flowtls/go.sum', 'sing-box/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-

      - name: 读取版本号
        id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      # 断言三件事：版本号带 rev、tags 带 with_flowtls、二进制名保持 sing-box。
      # 这三条是「与官方版区分」的全部依据，坏了就等于发了一个假官方版。
      - name: make verify
        run: make verify

      # 硬要求：check 不需要 root。
      # raw socket 只在 Start(StartStateStart) 里申请，构造函数绝不碰特权资源。
      - name: 配置示例可通过 check（非 root）
        run: |
          bin=./dist/sing-box-$(cat VERSION)-linux-amd64
          for f in deploy.example/*.json; do
            echo "checking $f"
            "$bin" check -c "$f"
          done

      # 只在 verify 保存 Go 缓存，避免并发写入同一个缓存 key。
      - name: 保存 Go 缓存
        if: steps.gocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gomod-${{ runner.os }}-${{ hashFiles('flowtls/go.sum', 'sing-box/go.sum') }}

  # ------------------------------------------------------------------ 单测关卡
  test:
    name: 单测与冻结向量门禁
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod
          cache: false

      - name: 恢复 Go 缓存
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gomod-${{ runner.os }}-${{ hashFiles('flowtls/go.sum', 'sing-box/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-

      - name: go vet
        working-directory: flowtls
        run: go vet ./...

      # wire format v2 的绝对字节基线。
      # Rust 参考实现已冻结在 legacy-rust 分支，但它导出的黄金向量在仓库里，
      # 所以这道门禁不需要 Rust 工具链。
      - name: 冻结向量门禁
        run: bash docs/interop_check.sh

      - name: 单测（含竞态检测）
        run: make test

      - name: gofmt 检查
        run: |
          out=$(gofmt -l flowtls sing-box/protocol/flowtls sing-box/option/flowtls.go)
          if [ -n "$out" ]; then
            echo "以下文件未格式化："
            echo "$out"
            exit 1
          fi

  # ------------------------------------------------------- 真链路（自托管）
  e2e:
    name: 真链路矩阵（自托管，需 CAP_NET_RAW）
    # 托管 runner 没有 raw socket，只能跑在自带权限的机器上。
    # 想启用：给一台自托管 runner 打上 self-hosted + flowtls-e2e 标签。
    runs-on: [self-hosted, flowtls-e2e]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod

      - name: 真链路矩阵
        run: bash docs/e2e_matrix.sh

      # 脚本里 iptables_mode 固定为 none，正常不会改系统状态。
      # 这里再确认一次，避免以后有人改成 auto 却忘了清理。
      # 只查矩阵实际用的那个标记（ip_id_mark: 61703 → 0xf1004000），
      # 不要用宽泛的 "0x"——宿主机可能本来就有别的 u32 规则。
      - name: 确认没有残留 iptables 规则
        run: |
          if sudo iptables -t raw -S PREROUTING | grep -q '0xf1004000'; then
            echo "发现残留规则："
            sudo iptables -t raw -S PREROUTING
            exit 1
          fi
          if sudo iptables -S OUTPUT | grep -q 'sport 44300'; then
            echo "发现残留客户端规则："
            sudo iptables -S OUTPUT
            exit 1
          fi

      - name: 收集日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: /tmp/ft-e2e/*.log
          if-no-files-found: ignore
