name: Build

# 结构照抄上游 sing-box 的 .github/workflows/build.yml，只保留 FlowTLS 需要的部分。
#
# 上游的做法有三点值得抄，也是这份文件的骨架：
#
#   1. **版本号单独一个 job 算**（calculate_version），其它 job 通过 needs 引用。
#      版本号只有一个来源，不会出现「Release 标题是 A、二进制里是 B」。
#   2. **tags / ldflags 从 release/ 目录读，不写在 yaml 里**。
#      上游已经维护了 DEFAULT_BUILD_TAGS_OTHERS / _WINDOWS / LDFLAGS 三个文件，
#      在 yaml 里再抄一遍必然漂移（我们之前就抄漏了 windows 的两个 tag）。
#   3. **产物统一 Archive 成 tar.gz / zip 再上传**，里面放 LICENSE。
#      直接传裸二进制下载后没有许可证，也不方便分发。
#
# 与上游的差异：
#   - 不做 deb / rpm / apk / pacman 打包（FlowTLS 只发二进制）
#   - 不做 glibc / musl 两种 variant（CGO_ENABLED=0 已经静态，
#     musl 变体对我们没有收益）
#   - 不做 Android / Apple 库（sing-box 本体不依赖，属 FlowTLS 以外的事）

on:
  workflow_dispatch:
    inputs:
      version:
        description: "手动同步 sing-box 正式版源码后填写发行版本；留空使用 VERSION"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # 构建和发布均不因同一版本的重试被取消。
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------ 版本号（唯一来源）
  calculate_version:
    name: 计算版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.outputs.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: outputs
        run: |
          # 版本只能来自 VERSION 或开发者手动输入，不自动查询/更新上游源码。
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version=$(cat VERSION)
          fi
          # 发行号必须携带 rev，防止把产物误标成官方 sing-box。
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-rev\.[0-9]+$'; then
            echo "版本号必须符合 <上游正式版>-rev.N：$version"
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "发行 tag 已存在，拒绝覆盖：v${version}"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_ENV"

  # ------------------------------------------------------------------ 单测与门禁
  test:
    name: 单测与门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod
          # 缓存显式接管，原因见「缓存」注释。
          cache: false

      - name: 恢复 Go 缓存
        id: gocache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('flowtls/go.sum', 'sing-box/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      # tags / ldflags 与发行版构建用完全相同的来源，
      # 否则单测跑的是「另一套编译配置」，测过了不代表发出去的对。
      - name: 设置构建标签
        run: |
          echo "BUILD_TAGS=$(cat sing-box/release/DEFAULT_BUILD_TAGS_OTHERS),with_flowtls" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$(cat sing-box/release/LDFLAGS)" >> "$GITHUB_ENV"

      - name: go vet
        working-directory: flowtls
        run: go vet ./...

      # wire format v2 的绝对字节基线。
      # Rust 参考实现已冻结在 legacy-rust 分支，但黄金向量在仓库里，
      # 所以这道门禁不需要 Rust 工具链。
      - name: 冻结向量门禁
        run: bash docs/interop_check.sh

      - name: flowtls 单测（含竞态检测）
        working-directory: flowtls
        run: go test -race ./...

      - name: sing-box 适配层单测
        working-directory: sing-box
        run: go test -race ./protocol/flowtls/...

      - name: gofmt 检查
        run: |
          out=$(gofmt -l flowtls sing-box/protocol/flowtls sing-box/option/flowtls.go)
          if [ -n "$out" ]; then
            echo "以下文件未格式化："
            echo "$out"
            exit 1
          fi

      - name: 保存 Go 缓存
        # 只在这里保存：matrix 里十几个 job 同时存同一个 key 会互相覆盖。
        if: steps.gocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('flowtls/go.sum', 'sing-box/go.sum') }}

  # ------------------------------------------------------------------ 发行版构建
  build:
    name: 构建 ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.suffix && format('/{0}', matrix.suffix) }}
    needs: [calculate_version, test]
    runs-on: ubuntu-latest
    strategy:
      # 一个平台失败不取消其他平台：arm 挂了也该看到 amd64 能不能出。
      fail-fast: false
      matrix:
        # Linux 是主力发行目标（AF_PACKET + iptables）。
        # Windows 走 WinDivert 驱动，只支持 amd64/386（驱动资产只有这两份）。
        # macOS / FreeBSD 不发行：没有等价的包拦截能力，能编译但跑不起来。
        include:
          # **只有 windows/amd64**。windows/386 编不出来，原因在上游：
          # DEFAULT_BUILD_TAGS_WINDOWS 含 with_naive_outbound，它依赖
          # cronet-go，而 cronet-go 没有 386 的实现
          # （`build constraints exclude all Go files`）。
          # 我们自己的 flowtls 模块是支持 386 的（WinDivert32.sys 也在），
          # 一旦上游补齐 386 就可以直接加回来。
          - { goos: windows, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "5", suffix: "v5" }
          - { goos: linux, goarch: arm, goarm: "6", suffix: "v6" }
          - { goos: linux, goarch: arm, goarm: "7", suffix: "v7" }
          - { goos: linux, goarch: "386", go386: sse2 }
          - { goos: linux, goarch: "386", go386: softfloat, suffix: "softfloat" }
          - { goos: linux, goarch: mips, gomips: hardfloat, suffix: "hardfloat" }
          - { goos: linux, goarch: mips, gomips: softfloat, suffix: "softfloat" }
          - { goos: linux, goarch: mipsle, gomips: hardfloat, suffix: "hardfloat" }
          - { goos: linux, goarch: mipsle, gomips: softfloat, suffix: "softfloat" }
          - { goos: linux, goarch: mips64, gomips64: hardfloat, suffix: "hardfloat" }
          - { goos: linux, goarch: mips64, gomips64: softfloat, suffix: "softfloat" }
          - { goos: linux, goarch: mips64le, gomips64: hardfloat, suffix: "hardfloat" }
          - { goos: linux, goarch: mips64le, gomips64: softfloat, suffix: "softfloat" }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: loong64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod
          cache: false

      - name: 恢复 Go 缓存
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('flowtls/go.sum', 'sing-box/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      # **照抄上游的关键一步**：tags / ldflags 从 release/ 目录读，
      # 不在 yaml 里重新抄一遍。windows 有独立的 tag 列表
      # （多 with_naive_outbound 与 with_purego），抄错就等于发了个残缺版。
      - name: 设置构建标签
        run: |
          set -xeuo pipefail
          if [ "${{ matrix.goos }}" = "windows" ]; then
            TAGS=$(cat sing-box/release/DEFAULT_BUILD_TAGS_WINDOWS)
          else
            TAGS=$(cat sing-box/release/DEFAULT_BUILD_TAGS_OTHERS)
          fi
          echo "BUILD_TAGS=${TAGS},with_flowtls" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$(cat sing-box/release/LDFLAGS)" >> "$GITHUB_ENV"

      - name: 构建
        working-directory: sing-box
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GO386: ${{ matrix.go386 }}
          GOMIPS: ${{ matrix.gomips }}
          GOMIPS64: ${{ matrix.gomips64 }}
        run: |
          set -xeuo pipefail
          mkdir -p ../dist
          go build -v -trimpath -o ../dist/sing-box -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box

      # 版本断言必须在打包之前：一个版本号里没有 rev 的二进制
      # 会被误认为是官方版，这比构建失败严重得多。
      #
      # 只有 linux/amd64 那一格能真的执行（runner 本身是这个架构），
      # 其余产物的版本号正确性由「同一个 ldflags 变量」保证——
      # 它们在 yaml 里只有一处定义，不存在某一格写错的可能。
      #
      # 注意不能用 `... | grep -q`：grep 命中即退出会让写端收到 EPIPE，
      # 配合 pipefail 会把成功判成失败（DEVTIPS 第 73 条）。
      - name: 断言版本号与 tag
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -xeuo pipefail
          out=$(./dist/sing-box version)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -F 'with_flowtls' > /dev/null \
            || { echo "FAIL: 缺少 with_flowtls tag"; exit 1; }
          printf '%s\n' "$out" | grep -F '${{ needs.calculate_version.outputs.version }}' > /dev/null \
            || { echo "FAIL: 版本号不符"; exit 1; }

      # 产物命名照抄上游：sing-box-<version>-<os>-<arch>[v7][-softfloat]
      - name: 设置产物名
        run: |
          set -xeuo pipefail
          DIR_NAME="sing-box-${{ needs.calculate_version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ -n "${{ matrix.suffix }}" ]; then
            case "${{ matrix.goarch }}" in
              arm) DIR_NAME="${DIR_NAME}${{ matrix.suffix }}" ;;
              *) DIR_NAME="${DIR_NAME}-${{ matrix.suffix }}" ;;
            esac
          fi
          echo "DIR_NAME=${DIR_NAME}" >> "$GITHUB_ENV"

      # Archive 照抄上游：打成一个目录再压 tar.gz / zip，里面放 LICENSE。
      # **LICENSE 缺失必须让构建失败**：sing-box 是 GPLv3，
      # 分发不带许可证不合规。所以这里不用 `|| true` 兜底。
      - name: 打包
        run: |
          set -xeuo pipefail
          cd dist
          mkdir -p "${DIR_NAME}"
          cp ../LICENSE "${DIR_NAME}/"
          # WinDivert 驱动以字节数组内嵌进二进制、运行时落盘成 .sys 加载。
          # 它是独立的 LGPLv3 作品（不是衍生物），但再分发必须附许可证原文，
          # 否则不合规。只内嵌在二进制里用户拿不到，必须随包放一份。
          # 只有 windows 产物内嵌驱动（embed 文件带 windows build tag），
          # Linux 二进制里没有 WinDivert 字节，不需要附这份许可证。
          if [ "${{ matrix.goos }}" = "windows" ]; then
            mkdir -p "${DIR_NAME}/licenses"
            cp ../flowtls/windivert_assets/LICENSE.txt \
               "${DIR_NAME}/licenses/WinDivert-LGPLv3.txt"
            cp ../flowtls/windivert_assets/SHA256SUMS \
               "${DIR_NAME}/licenses/WinDivert-SHA256SUMS.txt"
          fi
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp sing-box "${DIR_NAME}/sing-box.exe"
            zip -r "${DIR_NAME}.zip" "${DIR_NAME}"
          else
            cp sing-box "${DIR_NAME}/sing-box"
            tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
          fi
          rm -r "${DIR_NAME}" sing-box

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix && format('-{0}', matrix.suffix) }}
          # 用多行 block scalar 而不是压成一行：upload-artifact 的 path
          # 每行一个 glob，这里是两个。别写成 "a b"——那会被当成一个路径。
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------- PassWall 补丁包
  #
  # 这个包**不含任何二进制**（架构无关），它只做两件事：
  #   1. 把 PassWall「组件更新」里的 Sing-Box 源换成我们的 Release；
  #   2. 给节点配置加上 flowtls 协议和对应字段。
  # 逻辑全部住在包内的 Lua 文件里，PassWall 源码里只留 5 行调用，
  # 所以 PassWall 升级后跑一次 apply 就能恢复（另有 cron 自愈）。
  passwall:
    name: PassWall 补丁包（架构无关）
    needs: [calculate_version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 逻辑单测（不需要 OpenWrt）
        run: |
          set -xeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          cd passwall-flowtls-patchpackage
          lua5.1 scripts/luatest.lua .

      - name: 取 apk 打包工具
        run: |
          set -xeuo pipefail
          # apk v3 的容器是 ADB 格式，自己实现不划算，用官方静态二进制。
          #
          # 三个来源都试过，只有第三个能用：
          #   1. OpenWrt SDK 的 staging_dir/host/bin/apk —— 是个 224 字节的
          #      shell wrapper，靠 lib/ld-linux 加载 host/lib 下 98 个 .so，
          #      单独提取必然跑不起来（DEVTIPS 已记）；
          #   2. gitlab.alpinelinux.org 的 build-static artifact ——
          #      裸 curl 返回 418（GitLab 用它拦未认证/爬虫）；
          #   3. dl-cdn.alpinelinux.org 的 apk-tools-static 包 —— 可用，
          #      而且它是 gzip tar（不是 ADB），本地 tar -xzf 就能取出
          #      sbin/apk.static，静态链接、零依赖。
          #
          # 版本要说清：OpenWrt 25.12 用的是 apk-tools 3.x，
          # 所以取 edge 的 3.x，不要用 2.x（mkpkg 的参数集不同）。
          mkdir -p /tmp/apktool
          base=https://dl-cdn.alpinelinux.org/alpine/edge/main/x86_64
          pkg=$(curl -fsSL --max-time 60 "$base/" \
            | grep -oE 'apk-tools-static-3\.[0-9.]+-r[0-9]+\.apk' | sort -uV | tail -n 1)
          if [ -z "$pkg" ]; then
            echo '取不到 apk-tools-static，本次只出 .ipk（补丁功能不受影响）' >&2
            rm -rf /tmp/apktool
            exit 0
          fi
          curl -fsSL --max-time 180 -o /tmp/apktool/pkg.apk "$base/$pkg"
          tar -xzf /tmp/apktool/pkg.apk -C /tmp/apktool
          install -m 755 /tmp/apktool/sbin/apk.static /tmp/apktool/apk
          rm -rf /tmp/apktool/pkg.apk /tmp/apktool/sbin /tmp/apktool/lib
          /tmp/apktool/apk --version

      - name: 打包
        env:
          SIGN_KEY_B64: ${{ secrets.APK_SIGN_KEY_B64 }}
        run: |
          set -xeuo pipefail
          cd passwall-flowtls-patchpackage
          APKTOOL=''
          [ -x /tmp/apktool/apk ] && APKTOOL='--apk-tool /tmp/apktool/apk'
          SIGNKEY=''
          if [ -n "$SIGN_KEY_B64" ]; then
            printf '%s' "$SIGN_KEY_B64" | base64 -d > /tmp/apk.key
            chmod 600 /tmp/apk.key
            SIGNKEY='--sign-key /tmp/apk.key'
            # 公钥必须与私钥配对，否则设备上验签失败（装不上）。
            openssl rsa -in /tmp/apk.key -pubout -out keys/flowtls.pem
          fi
          # shellcheck disable=SC2086
          sh scripts/pack.sh --out dist $APKTOOL $SIGNKEY
          rm -f /tmp/apk.key
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: passwall-patch
          path: |
            passwall-flowtls-patchpackage/dist/*.ipk
            passwall-flowtls-patchpackage/dist/*.apk
            passwall-flowtls-patchpackage/dist/flowtls.pem
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------- 发布
  release:
    name: 发布 Release
    needs: [calculate_version, test, build, passwall]
    # 只有开发者手动启动并且测试、所有架构构建成功后才创建正式 Release。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      - name: 下载 PassWall 补丁包
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: passwall-patch
          merge-multiple: true

      - name: 生成校验和
        run: |
          set -xeuo pipefail
          cd artifacts
          ls -lh
          # sha256 是发布物的最低要求：用户下载后要能自己验证完整性。
          sha256sum * > sha256sum.txt
          cat sha256sum.txt

      - name: 生成 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.calculate_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.ipk
            artifacts/*.apk
            artifacts/flowtls.pem
            artifacts/sha256sum.txt
          draft: false
          prerelease: false
          body: |
            `sing-box ${{ needs.calculate_version.outputs.version }}` — FlowTLS rev 发行版。

            与官方版的唯一区别是版本号后缀 `-rev.N` 与内置的 `with_flowtls` 协议；
            二进制名保持 `sing-box`，配置格式与上游完全兼容。

            校验完整性：

            ```
            sha256sum -c sha256sum.txt
            ```

            ---

            ## PassWall 补丁包（`passwall-flowtls_*.ipk` / `.apk`）

            装上之后可以在 PassWall 网页里**直接更新到本项目的核心**，
            并在「添加节点」里选到 `FlowTLS` 协议。补丁包本身不含内核。

            先导入本站公钥（三选一）：

            ```sh
            # 1) 网页：系统 → 管理权 → 软件包仓库公钥，粘贴 flowtls.pem 的内容
            # 2) 命令行：
            wget -O /etc/apk/keys/flowtls.pem \
              https://github.com/luowei729/FlowTLS/releases/latest/download/flowtls.pem
            # 3) 或安装时临时放行（不推荐长期使用）：
            #    apk add --allow-untrusted ./passwall-flowtls_*.apk
            ```

            安装：

            ```sh
            # apk 系统（OpenWrt 24.10+ / ImmortalWrt 25.x）
            apk add ./passwall-flowtls_*_all.apk
            # opkg 系统（22.03 / 23.05）
            opkg install ./passwall-flowtls_*_all.ipk
            ```

            > 包名里的版本是 OpenWrt 风格 `-rN`（如 `1.14.4-r6`），
            > 与前缀 `-rev.N` 是同一个意思的两种写法——apk 的版本语法不接受
            > `rev.`，而 `-rN` 正是 OpenWrt 表达「同一上游版本第 N 次打包」的原生写法。
            > 所以直接用通配符最省事，不要照抄版本号。

            然后到 PassWall → 组件更新 → Sing-Box 版本 → 检查更新，
            即可换成 FlowTLS 核心；到节点列表 → 添加节点 → 协议选 `FlowTLS`。

            常用命令：

            ```sh
            passwall-flowtls status     # 看补丁是否完整
            passwall-flowtls apply      # 手动重打（升级 PassWall 后）
            passwall-flowtls uninstall  # 还原 PassWall 官方行为
            ```

      # PassWall 组件更新的元数据。
      #
      # 必须放在 Release **创建之后**：它要读 assets[].digest（GitHub 只在
      # 资产上传后才提供 sha256），而 PassWall 下载完会拿它做完整性校验，
      # 缺了就直接拒绝安装。
      #
      # 地址固定为 releases/latest/download/sing-box-release-api.json，
      # 所以每发一个版本，PassWall 那边读到的就是这一版（不用改客户端）。
      - name: 生成并上传组件更新元数据
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -xeuo pipefail
          sudo apt-get install -y -qq jq
          cd passwall-flowtls-patchpackage
          sh scripts/gen-release-json.sh \
            --repo "${{ github.repository }}" \
            --tag "v${{ needs.calculate_version.outputs.version }}" \
            --out sing-box-release-api.json
          # --clobber：重跑同版本时覆盖旧元数据，而不是报 422。
          gh release upload "v${{ needs.calculate_version.outputs.version }}" \
            sing-box-release-api.json --clobber
          cat sing-box-release-api.json | head -20
