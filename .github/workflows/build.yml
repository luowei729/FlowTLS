name: Build

# 结构照抄上游 sing-box 的 .github/workflows/build.yml，只保留 FlowTLS 需要的部分。
#
# 上游的做法有三点值得抄，也是这份文件的骨架：
#
#   1. **版本号单独一个 job 算**（calculate_version），其它 job 通过 needs 引用。
#      版本号只有一个来源，不会出现「Release 标题是 A、二进制里是 B」。
#   2. **tags / ldflags 从 release/ 目录读，不写在 yaml 里**。
#      上游已经维护了 DEFAULT_BUILD_TAGS_OTHERS / _WINDOWS / LDFLAGS 三个文件，
#      在 yaml 里再抄一遍必然漂移（我们之前就抄漏了 windows 的两个 tag）。
#   3. **产物统一 Archive 成 tar.gz / zip 再上传**，里面放 LICENSE。
#      直接传裸二进制下载后没有许可证，也不方便分发。
#
# 与上游的差异：
#   - 不做 deb / rpm / apk / pacman 打包（FlowTLS 只发二进制）
#   - 不做 glibc / musl 两种 variant（CGO_ENABLED=0 已经静态，
#     musl 变体对我们没有收益）
#   - 不做 Android / Apple 库（sing-box 本体不依赖，属 FlowTLS 以外的事）

on:
  workflow_dispatch:
    inputs:
      version:
        description: "手动同步 sing-box 正式版源码后填写发行版本；留空使用 VERSION"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # 构建和发布均不因同一版本的重试被取消。
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------ 版本号（唯一来源）
  calculate_version:
    name: 计算版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.outputs.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: outputs
        run: |
          # 版本只能来自 VERSION 或开发者手动输入，不自动查询/更新上游源码。
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version=$(cat VERSION)
          fi
          # 发行号必须携带 rev，防止把产物误标成官方 sing-box。
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-rev\.[0-9]+$'; then
            echo "版本号必须符合 <上游正式版>-rev.N：$version"
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "发行 tag 已存在，拒绝覆盖：v${version}"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_ENV"

  # ------------------------------------------------------------------ 单测与门禁
  test:
    name: 单测与门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod
          # 缓存显式接管，原因见「缓存」注释。
          cache: false

      - name: 恢复 Go 缓存
        id: gocache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('flowtls/go.sum', 'sing-box/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      # tags / ldflags 与发行版构建用完全相同的来源，
      # 否则单测跑的是「另一套编译配置」，测过了不代表发出去的对。
      - name: 设置构建标签
        run: |
          echo "BUILD_TAGS=$(cat sing-box/release/DEFAULT_BUILD_TAGS_OTHERS),with_flowtls" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$(cat sing-box/release/LDFLAGS)" >> "$GITHUB_ENV"

      - name: go vet
        working-directory: flowtls
        run: go vet ./...

      # wire format v2 的绝对字节基线。
      # Rust 参考实现已冻结在 legacy-rust 分支，但黄金向量在仓库里，
      # 所以这道门禁不需要 Rust 工具链。
      - name: 冻结向量门禁
        run: bash docs/interop_check.sh

      - name: flowtls 单测（含竞态检测）
        working-directory: flowtls
        run: go test -race ./...

      - name: sing-box 适配层单测
        working-directory: sing-box
        run: go test -race ./protocol/flowtls/...

      - name: gofmt 检查
        run: |
          out=$(gofmt -l flowtls sing-box/protocol/flowtls sing-box/option/flowtls.go)
          if [ -n "$out" ]; then
            echo "以下文件未格式化："
            echo "$out"
            exit 1
          fi

      - name: 保存 Go 缓存
        # 只在这里保存：matrix 里十几个 job 同时存同一个 key 会互相覆盖。
        if: steps.gocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('flowtls/go.sum', 'sing-box/go.sum') }}

  # ------------------------------------------------------------------ 发行版构建
  build:
    name: 构建 ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.suffix && format('/{0}', matrix.suffix) }}
    needs: [calculate_version, test]
    runs-on: ubuntu-latest
    strategy:
      # 一个平台失败不取消其他平台：arm 挂了也该看到 amd64 能不能出。
      fail-fast: false
      matrix:
        # FlowTLS 使用 Linux raw socket；非 Linux 的 socket_stub.go 不提供协议运行所需的字段和批量发送实现。
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "5", suffix: "v5" }
          - { goos: linux, goarch: arm, goarm: "6", suffix: "v6" }
          - { goos: linux, goarch: arm, goarm: "7", suffix: "v7" }
          - { goos: linux, goarch: "386", go386: sse2 }
          - { goos: linux, goarch: "386", go386: softfloat, suffix: "softfloat" }
          - { goos: linux, goarch: mips, gomips: hardfloat, suffix: "hardfloat" }
          - { goos: linux, goarch: mips, gomips: softfloat, suffix: "softfloat" }
          - { goos: linux, goarch: mipsle, gomips: hardfloat, suffix: "hardfloat" }
          - { goos: linux, goarch: mipsle, gomips: softfloat, suffix: "softfloat" }
          - { goos: linux, goarch: mips64, gomips64: hardfloat, suffix: "hardfloat" }
          - { goos: linux, goarch: mips64, gomips64: softfloat, suffix: "softfloat" }
          - { goos: linux, goarch: mips64le, gomips64: hardfloat, suffix: "hardfloat" }
          - { goos: linux, goarch: mips64le, gomips64: softfloat, suffix: "softfloat" }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: loong64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod
          cache: false

      - name: 恢复 Go 缓存
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('flowtls/go.sum', 'sing-box/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      # **照抄上游的关键一步**：tags / ldflags 从 release/ 目录读，
      # 不在 yaml 里重新抄一遍。windows 有独立的 tag 列表
      # （多 with_naive_outbound 与 with_purego），抄错就等于发了个残缺版。
      - name: 设置构建标签
        run: |
          set -xeuo pipefail
          if [ "${{ matrix.goos }}" = "windows" ]; then
            TAGS=$(cat sing-box/release/DEFAULT_BUILD_TAGS_WINDOWS)
          else
            TAGS=$(cat sing-box/release/DEFAULT_BUILD_TAGS_OTHERS)
          fi
          echo "BUILD_TAGS=${TAGS},with_flowtls" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$(cat sing-box/release/LDFLAGS)" >> "$GITHUB_ENV"

      - name: 构建
        working-directory: sing-box
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GO386: ${{ matrix.go386 }}
          GOMIPS: ${{ matrix.gomips }}
          GOMIPS64: ${{ matrix.gomips64 }}
        run: |
          set -xeuo pipefail
          mkdir -p ../dist
          go build -v -trimpath -o ../dist/sing-box -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box

      # 版本断言必须在打包之前：一个版本号里没有 rev 的二进制
      # 会被误认为是官方版，这比构建失败严重得多。
      #
      # 只有 linux/amd64 那一格能真的执行（runner 本身是这个架构），
      # 其余产物的版本号正确性由「同一个 ldflags 变量」保证——
      # 它们在 yaml 里只有一处定义，不存在某一格写错的可能。
      #
      # 注意不能用 `... | grep -q`：grep 命中即退出会让写端收到 EPIPE，
      # 配合 pipefail 会把成功判成失败（DEVTIPS 第 73 条）。
      - name: 断言版本号与 tag
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -xeuo pipefail
          out=$(./dist/sing-box version)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -F 'with_flowtls' > /dev/null \
            || { echo "FAIL: 缺少 with_flowtls tag"; exit 1; }
          printf '%s\n' "$out" | grep -F '${{ needs.calculate_version.outputs.version }}' > /dev/null \
            || { echo "FAIL: 版本号不符"; exit 1; }

      # 产物命名照抄上游：sing-box-<version>-<os>-<arch>[v7][-softfloat]
      - name: 设置产物名
        run: |
          set -xeuo pipefail
          DIR_NAME="sing-box-${{ needs.calculate_version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ -n "${{ matrix.suffix }}" ]; then
            case "${{ matrix.goarch }}" in
              arm) DIR_NAME="${DIR_NAME}${{ matrix.suffix }}" ;;
              *) DIR_NAME="${DIR_NAME}-${{ matrix.suffix }}" ;;
            esac
          fi
          echo "DIR_NAME=${DIR_NAME}" >> "$GITHUB_ENV"

      # Archive 照抄上游：打成一个目录再压 tar.gz / zip，里面放 LICENSE。
      # **LICENSE 缺失必须让构建失败**：sing-box 是 GPLv3，
      # 分发不带许可证不合规。所以这里不用 `|| true` 兜底。
      - name: 打包
        run: |
          set -xeuo pipefail
          cd dist
          mkdir -p "${DIR_NAME}"
          cp ../LICENSE "${DIR_NAME}/"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp sing-box "${DIR_NAME}/sing-box.exe"
            zip -r "${DIR_NAME}.zip" "${DIR_NAME}"
          else
            cp sing-box "${DIR_NAME}/sing-box"
            tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
          fi
          rm -r "${DIR_NAME}" sing-box

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix && format('-{0}', matrix.suffix) }}
          # 用多行 block scalar 而不是压成一行：upload-artifact 的 path
          # 每行一个 glob，这里是两个。别写成 "a b"——那会被当成一个路径。
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------- 发布
  release:
    name: 发布 Release
    needs: [calculate_version, test, build]
    # 只有开发者手动启动并且测试、所有架构构建成功后才创建正式 Release。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      - name: 生成校验和
        run: |
          set -xeuo pipefail
          cd artifacts
          ls -lh
          # sha256 是发布物的最低要求：用户下载后要能自己验证完整性。
          sha256sum * > sha256sum.txt
          cat sha256sum.txt

      - name: 生成 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.calculate_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/sha256sum.txt
          draft: false
          prerelease: false
          body: |
            `sing-box ${{ needs.calculate_version.outputs.version }}` — FlowTLS rev 发行版。

            与官方版的唯一区别是版本号后缀 `-rev.N` 与内置的 `with_flowtls` 协议；
            二进制名保持 `sing-box`，配置格式与上游完全兼容。

            校验完整性：

            ```
            sha256sum -c sha256sum.txt
            ```
