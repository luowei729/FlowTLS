name: Sync sing-box release

on:
  # 每 6 小时检查一次上游最新正式 Release；不跟随 stable/development 分支。
  schedule:
    - cron: "17 */6 * * *"
  # 可从 Actions 页面手动重跑；始终以 main 为同步基线。
  workflow_dispatch:

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: 同步上游并派发正式构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 同步 sing-box 正式 Release 并计算发行版本
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 版本和源码都固定到 GitHub 最新正式 Release tag，避免引入开发版代码。
          release_tag=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.tag_name')
          if [[ ! "$release_tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "不支持的 sing-box 正式版本标签：$release_tag"
            exit 1
          fi
          upstream_version=${BASH_REMATCH[1]}

          current_version=$(tr -d '\r\n' < VERSION)
          if [[ ! "$current_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rev\.([0-9]+)$ ]]; then
            echo "VERSION 格式必须为 <上游版本>-rev.N：$current_version"
            exit 1
          fi
          current_base=${BASH_REMATCH[1]}
          current_revision=${BASH_REMATCH[2]}

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/SagerNet/sing-box.git
          git fetch --no-tags upstream "refs/tags/${release_tag}:refs/tags/${release_tag}"

          before_tree=$(git rev-parse HEAD:sing-box)
          # go.mod/go.sum 必须跟随该正式版；只对这两个依赖清单采用上游侧。
          # 其他本地定制源码发生冲突时失败关闭，等待人工合并。
          if ! git subtree pull --prefix=sing-box upstream "$release_tag" --squash; then
            conflicts=$(git diff --name-only --diff-filter=U)
            if [ -z "$conflicts" ]; then
              echo "subtree pull 失败，但没有可自动处理的文件冲突。"
              exit 1
            fi
            while IFS= read -r conflict; do
              case "$conflict" in
                sing-box/go.mod|sing-box/go.sum)
                  echo "依赖清单冲突，采用 sing-box ${release_tag} 版本：$conflict"
                  git checkout --theirs -- "$conflict"
                  git add "$conflict"
                  ;;
                *)
                  echo "项目定制与上游冲突，停止自动发布：$conflict"
                  exit 1
                  ;;
              esac
            done <<< "$conflicts"
            git commit --no-edit
          fi
          after_tree=$(git rev-parse HEAD:sing-box)

          source_changed=false
          if [ "$before_tree" != "$after_tree" ]; then
            source_changed=true
          fi
          release_changed=false
          if [ "$current_base" != "$upstream_version" ]; then
            release_changed=true
          fi
          if [ "$source_changed" = true ] || [ "$release_changed" = true ]; then
            if [ "$release_changed" = true ]; then
              revision=1
            else
              revision=$((current_revision + 1))
            fi
            version="${upstream_version}-rev.${revision}"
            tag="v${version}"
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "目标发行标签已存在，拒绝覆盖：$tag"
              exit 1
            fi
            printf '%s\n' "$version" > VERSION
            echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
            echo "mode=main" >> "$GITHUB_OUTPUT"
          else
            # 首次安装时发布当前版本；失败或中断后，重试已有 tag 而不覆盖它。
            version=$current_version
            tag="v${version}"
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              if gh --repo "$GITHUB_REPOSITORY" release view "$tag" >/dev/null 2>&1; then
                echo "源码和正式 Release 均无变化，跳过。"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
              echo "mode=tag" >> "$GITHUB_OUTPUT"
            else
              echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
              echo "mode=main" >> "$GITHUB_OUTPUT"
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # 必须在 subtree 同步后安装 Go，避免上游提高 go directive 时沿用旧工具链。
      - uses: actions/setup-go@v5
        if: steps.sync.outputs.skip != 'true'
        with:
          go-version-file: sing-box/go.mod
          cache: false

      - name: 对齐依赖、提交同步并派发正式构建
        if: steps.sync.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.sync.outputs.version }}
          TAG: ${{ steps.sync.outputs.tag }}
          RELEASE_TAG: ${{ steps.sync.outputs.release_tag }}
          MODE: ${{ steps.sync.outputs.mode }}
        run: |
          set -euo pipefail

          # 同步 Go 版本与 sing-box 使用的关键依赖，保持两个模块的类型身份一致。
          go_version=$(awk '$1 == "go" { print $2; exit }' sing-box/go.mod)
          quic_version=$(awk '$1 == "github.com/sagernet/quic-go" { print $2; exit }' sing-box/go.mod)
          sing_version=$(awk '$1 == "github.com/sagernet/sing" { print $2; exit }' sing-box/go.mod)
          sing_quic_version=$(awk '$1 == "github.com/sagernet/sing-quic" { print $2; exit }' sing-box/go.mod)
          if [ -z "$go_version" ] || [ -z "$quic_version" ] || [ -z "$sing_version" ] || [ -z "$sing_quic_version" ]; then
            echo "无法从 sing-box/go.mod 读取 Go 或协议依赖版本。"
            exit 1
          fi
          (
            cd flowtls
            go mod edit -go="$go_version" \
              -require="github.com/sagernet/quic-go@${quic_version}" \
              -require="github.com/sagernet/sing@${sing_version}" \
              -require="github.com/sagernet/sing-quic@${sing_quic_version}"
            go mod tidy
          )
          git diff --check
          if [ "$MODE" = "main" ]; then
            git add sing-box VERSION flowtls/go.mod flowtls/go.sum
            if ! git diff --cached --quiet; then
              git commit -m "chore: sync sing-box ${RELEASE_TAG}"
              git push origin HEAD:main
            fi
            build_ref=main
          else
            build_ref=$TAG
          fi

          # 先派发完整矩阵构建；全部成功后 Build workflow 才创建 tag 和正式 Release。
          gh --repo "$GITHUB_REPOSITORY" workflow run build.yml --ref "$build_ref" \
            --field "version=$VERSION" --field "publish=true"
          echo "已同步 sing-box ${RELEASE_TAG}，并派发正式版构建：$TAG"
