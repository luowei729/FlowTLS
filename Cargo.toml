[package]
name = "flowtls"
version = "0.1.0"
edition = "2021"
description = "FakeTCP + QUIC 伪装成 HTTPS 的代理"

[dependencies]
# QUIC 协议内核：只使用其传输无关的状态机，socket 层由我们自己的 FakeTCP 实现
quinn-proto = { version = "0.11.17", default-features = false, features = ["rustls-ring", "log", "bloom"] }
# TLS：用于同端口真网站的证书握手，以及 QUIC 内层自签证书
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
# 异步运行时
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
# CLI 与配置
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
# 外层伪装层的加密与密钥派生
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
# 内层 QUIC 自签证书
rcgen = "0.13"
# 工具库
rand = "0.8"
bytes = "1"
futures = "0.3"
anyhow = "1"
thiserror = "2"
libc = "0.2"
socket2 = { version = "0.5", features = ["all"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[[bin]]
name = "flowtls"
path = "src/main.rs"
