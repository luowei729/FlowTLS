# 客户端示例配置
# 复制到 deploy/ 并填入真实值；deploy/ 已在 .gitignore 中，不会入库。
server: "YOUR_SERVER_IP:8443"

# 必须与服务端一致
password: "CHANGE_ME_STRONG_PASSWORD"

# 伪装用的 SNI（应与服务端证书匹配）
sni: "your.domain"

faketcp:
  # 固定源端口：iptables 靠它精确拦截内核对伪造连接的 RST
  source_port: 44300
  handshake: symbolic
  ip_id_magic: 0xF107

socks5:
  listen: "0.0.0.0:1080"
  username: "admin"
  password: "CHANGE_ME"

http:
  listen: "0.0.0.0:8080"
  username: "admin"
  password: "CHANGE_ME"

# HTTPS 代理入口默认开启（127.0.0.1:8443），鉴权沿用 SOCKS5 配置，
# 证书默认运行时自签（浏览器首次访问需手动信任）。
# 需要局域网访问或使用自己的证书时，取消下面注释并修改：
# https:
#   listen: "0.0.0.0:8443"
#   username: "admin"
#   password: "CHANGE_ME"
#   cert: "/path/to/fullchain.pem"
#   key: "/path/to/privkey.pem"

net:
  mode: "auto"
  # 拥塞窗口初始值，仅作为自适应算法的起点，单位字节
  max_cwnd: 8388608

# UDP 转发（QUIC DATAGRAM）：不可靠、不重传、不补发。
# 只能通过 SOCKS5 入口使用（HTTP/HTTPS 代理协议本身不支持 UDP）。
# 客户端用 `socks5h://` 或 `--socks5-hostname` 时 DNS 也走 UDP 转发；
# 用普通 `socks5://` 则 DNS 在本地解析，会泄漏到本地网络。
udp:
  # 关闭后 SOCKS5 的 UDP ASSOCIATE 会返回「命令不支持」
  enabled: true
  # 每条连接最多允许的并发 UDP 会话数
  max_sessions: 256
  # 会话空闲回收秒数（建议与服务端保持一致）
  timeout_secs: 120
