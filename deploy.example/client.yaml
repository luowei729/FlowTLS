# 客户端示例配置
# 复制到 deploy/ 并填入真实值；deploy/ 已在 .gitignore 中，不会入库。
server: "YOUR_SERVER_IP:8443"

# 必须与服务端一致
password: "CHANGE_ME_STRONG_PASSWORD"

# 伪装用的 SNI（应与服务端证书匹配）
sni: "your.domain"

faketcp:
  # 固定源端口：iptables 靠它精确拦截内核对伪造连接的 RST
  source_port: 44300
  handshake: symbolic
  ip_id_magic: 0xF107

socks5:
  listen: "0.0.0.0:1080"
  username: "admin"
  password: "CHANGE_ME"

http:
  listen: "0.0.0.0:8080"
  username: "admin"
  password: "CHANGE_ME"

# HTTPS 代理入口默认开启（127.0.0.1:8443），鉴权沿用 SOCKS5 配置，
# 证书默认运行时自签（浏览器首次访问需手动信任）。
# 需要局域网访问或使用自己的证书时，取消下面注释并修改：
# https:
#   listen: "0.0.0.0:8443"
#   username: "admin"
#   password: "CHANGE_ME"
#   cert: "/path/to/fullchain.pem"
#   key: "/path/to/privkey.pem"

net:
  mode: "auto"
  # 拥塞窗口初始值，仅作为自适应算法的起点，单位字节
  max_cwnd: 8388608
