# 服务端示例配置
# 复制到 deploy/ 并填入真实值；deploy/ 已在 .gitignore 中，不会入库。
listen: ":8443"

# 代理密码：客户端必须一致。请换成强密码。
password: "CHANGE_ME_STRONG_PASSWORD"

# 同端口伪装网站使用的真实证书
tls:
  cert: "/path/to/fullchain.pem"
  key: "/path/to/privkey.pem"

# 留空使用内置页面；也可指向一个静态站点目录
site:
  dir: ""

faketcp:
  # 用来标记「这是我们自己的 SYN」的 IP ID 高字节
  ip_id_magic: 0xF107
  handshake: symbolic
  # 机器在云 NAT 后面时，路由探测会拿到内网地址，
  # 必须显式填写对外公网 IP，否则客户端会丢弃回包。
  # local_ip: "1.2.3.4"

net:
  # auto：启动时自动写 iptables；none：不写
  mode: "auto"
  # 拥塞窗口初始值，仅作为自适应算法的起点，单位字节
  max_cwnd: 8388608

# UDP 转发（QUIC DATAGRAM）：不可靠、不重传、不补发，与 hysteria2 的 UDP 处理一致。
# 入口是 SOCKS5 的 UDP ASSOCIATE（浏览器 DNS、语音、游戏、QUIC 都走这里）。
udp:
  # 关掉后客户端发来的 UDP 数据报会被读出来直接丢弃。
  # 服务端必须显式开启，避免被当成公网 UDP 反射器。
  enabled: true
  # 每条连接最多允许的并发 UDP 会话数（每个会话一个 UDP socket）。
  # 防止单客户端耗尽文件描述符。
  max_sessions: 256
  # 会话空闲回收秒数。UDP 无连接，客户端消失后只能靠超时回收。
  timeout_secs: 120
