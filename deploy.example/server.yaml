# 服务端示例配置
# 复制到 deploy/ 并填入真实值；deploy/ 已在 .gitignore 中，不会入库。
listen: ":8443"

# 代理密码：客户端必须一致。请换成强密码。
password: "CHANGE_ME_STRONG_PASSWORD"

# 同端口伪装网站使用的真实证书
tls:
  cert: "/path/to/fullchain.pem"
  key: "/path/to/privkey.pem"

# 留空使用内置页面；也可指向一个静态站点目录
site:
  dir: ""

faketcp:
  # 用来标记「这是我们自己的 SYN」的 IP ID 高字节
  ip_id_magic: 0xF107
  handshake: symbolic
  # 机器在云 NAT 后面时，路由探测会拿到内网地址，
  # 必须显式填写对外公网 IP，否则客户端会丢弃回包。
  # local_ip: "1.2.3.4"

net:
  # auto：启动时自动写 iptables；none：不写
  mode: "auto"
  # 拥塞窗口初始值，仅作为自适应算法的起点，单位字节
  max_cwnd: 8388608
